# Ping the free Render web service so it does not sleep after 15 minutes idle.
# Free plan can still spin down if Actions are delayed — the app also retries
# cold starts from the phone UI.
name: Keep Render awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake karaoke web service
        run: |
          set -e
          # Prefer Railway; keep Render as fallback while both exist.
          curl -fsS --max-time 90 "https://karaoke-production-bc45.up.railway.app/api/health/" >/dev/null \
            || curl -fsS --max-time 90 "https://karaoke-04qs.onrender.com/api/auth/csrf/" >/dev/null
          echo "OK $(date -u +%H:%M:%SZ)"
